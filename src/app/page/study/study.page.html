<ion-content
  class="coming-content"
  [scrollY]="false">

  <ion-grid class="coming-shell">

    <ion-row class="coming-row">

      <ion-col size="12">

        <ion-card class="coming-card">

          <ion-card-content>

            <ion-icon
              class="coming-icon"
              name="book-outline">
            </ion-icon>

            <ion-text class="coming-title">
              Próximamente
            </ion-text>

            <ion-note class="coming-description">
              La sección de estudio estará disponible
              en una próxima actualización.
            </ion-note>

            <ion-spinner
              class="coming-spinner"
              name="crescent">
            </ion-spinner>

          </ion-card-content>

        </ion-card>

      </ion-col>

    </ion-row>

  </ion-grid>

</ion-content>
